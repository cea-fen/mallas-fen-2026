:root{
  color-scheme:light;
  --focus:#f59e0b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F4F4; --surface:#ffffff; --stage:#ffffff; --ink:#231F20; --body:#404040; --muted:#595959; --line:#d6d6d6; --rule:#A6A6A6; --fen-blue:#0034D9;
  --career:#5f8410; --career-ink:#ffffff;
  --pre:#6a2fd0; --post:#0a7a6f; --edge:#7a8592; --sel:#1b2320;
  --font:"Inter", "Helvetica Neue", Arial, system-ui, sans-serif; --display:"TT Wellingtons", "Inter", "Helvetica Neue", Arial, sans-serif;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font);font-size:15px;line-height:1.45}

/* Cabecera con color de carrera */
.band{background:var(--career);color:var(--career-ink);padding:22px 24px 0}
.bandtop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
.fenlogo{height:54px;width:auto;display:block}
.titles{text-align:right;margin-left:auto}
.band h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,3.4vw,38px);line-height:1.05;letter-spacing:-.01em;margin-left:auto}
.band p{margin:6px 0 18px;font-size:clamp(13px,1.4vw,16px);opacity:.9;font-stretch:96%}
.tabs[hidden]{display:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{font:inherit;font-size:13.5px;font-weight:600;border:0;padding:9px 14px;border-radius:0;cursor:pointer;white-space:nowrap;
  background:rgba(255,255,255,.16);color:#fff}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab[aria-disabled="true"]{cursor:not-allowed;opacity:.62}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-4px}

.workspace{padding:16px 24px 24px}
@media (max-width:960px){.workspace{padding:12px 12px 20px}}
.fit{position:relative}
.stage{transform-origin:0 0}
.zoom{margin-left:auto;font:inherit;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.zoom:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:6px}
.sw{width:15px;height:15px;border-radius:0;border:3px solid var(--c);background:transparent}
.sw.ind{border-width:2px;border-style:dashed}
.legend .k{font-size:12px;margin-right:6px}
.legend .lbl{margin-right:4px;color:var(--ink);font-weight:600}
.legend .scale{font-size:12px}

.scroller{overflow-x:auto;background:var(--stage);border:1px solid var(--line);border-radius:0}
.stage{position:relative}
.stage svg{position:absolute;inset:0;overflow:visible}

/* Encabezados de ciclo y semestre */
.cyc{position:absolute;top:8px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  color:var(--ink);border-bottom:2px solid var(--career)}
.semh{position:absolute;top:36px;height:20px;font-size:11.5px;color:var(--muted);text-align:center;font-stretch:92%}
.divider{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 5}

/* Cajas de curso */
.box{position:absolute;display:grid;grid-template-columns:1fr 24px;padding:0;margin:0;border:1px solid rgba(20,25,22,.38);border-radius:0;
  background:var(--f);color:#1d2330;font:inherit;text-align:center;cursor:pointer;z-index:1;
  transition:opacity .18s, filter .18s, box-shadow .18s}
.box .nm{display:flex;align-items:center;justify-content:center;padding:6px 5px 3px;font-size:10.9px;letter-spacing:-.01em;line-height:1.18;font-weight:500}
.box .cr{color:#1d2330;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(20,25,22,.38);background:rgba(255,255,255,.75);font-size:11px;font-weight:700}
.box:focus-visible{outline:2px solid var(--sel);outline-offset:3px}
.box .badge{position:absolute;top:-9px;left:6px;font-size:9.5px;font-weight:700;line-height:1;padding:3px 6px;border-radius:0;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.box .n3{position:absolute;bottom:2px;left:5px;font-size:9px;opacity:.75}

.stage.has-sel .box{opacity:.28;filter:saturate(.25)}
.stage.has-sel .box.sel,.stage.has-sel .box.pre,.stage.has-sel .box.post{opacity:1;filter:none}
.box.sel{box-shadow:0 0 0 2px #fff, 0 0 0 6px var(--focus), 0 0 26px 10px color-mix(in srgb, var(--focus) 55%, transparent);
  z-index:4;transform:scale(1.05);animation:halo 2.2s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 2px #fff, 0 0 0 6px var(--focus), 0 0 34px 16px color-mix(in srgb, var(--focus) 35%, transparent)}}
.box{transition:opacity .18s, filter .18s, box-shadow .18s, transform .18s}
.box.pre.d1{box-shadow:0 0 0 4px var(--pre);z-index:2}
.box.pre.d2{outline:2px dashed color-mix(in srgb, var(--pre) 75%, transparent);outline-offset:3px;z-index:2}
.box.pre.d3{outline:2px dashed color-mix(in srgb, var(--pre) 42%, transparent);outline-offset:3px;z-index:2}
.box.post.d1{box-shadow:0 0 0 4px var(--post);z-index:2}
.box.post.d2{outline:2px dashed color-mix(in srgb, var(--post) 75%, transparent);outline-offset:3px;z-index:2}
.box.post.d3{outline:2px dashed color-mix(in srgb, var(--post) 42%, transparent);outline-offset:3px;z-index:2}

/* Líneas */
.edge{opacity:.42;transition:opacity .18s}
.edge path{fill:none;stroke:var(--edge);stroke-width:1.25}
.edge circle{fill:var(--edge)}
.edge.hov{opacity:.95}
.edge.hov path{stroke:var(--ink);stroke-width:1.8}
.edge.hov circle{fill:var(--ink)}
.stage.has-sel .edge{opacity:.06}
.stage.has-sel .edge.pre path{stroke:var(--pre);stroke-width:2.3}
.stage.has-sel .edge.pre circle{fill:var(--pre)}
.stage.has-sel .edge.post path{stroke:var(--post);stroke-width:2.3}
.stage.has-sel .edge.post circle{fill:var(--post)}
.stage.has-sel .edge.d1{opacity:1}
.stage.has-sel .edge.d1 path{stroke-width:2.8}
.stage.has-sel .edge.d2{opacity:.7}
.stage.has-sel .edge.d3{opacity:.4}
.stage.has-sel .edge.d2 path,.stage.has-sel .edge.d3 path{stroke-width:1.6;stroke-dasharray:5 4}

/* Panel lateral */
.sheet{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;max-height:calc(100vh - 32px - env(safe-area-inset-top,0px));width:min(370px,calc(100% - 24px));z-index:20;
  display:flex;flex-direction:column;background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);
  border:1px solid rgba(20,25,22,.14);border-radius:0;box-shadow:0 14px 40px rgba(15,20,18,.20);transition:background .2s}
.sheet:hover,.sheet:focus-within{background:rgba(255,255,255,.97)}
.sheet.left{right:auto;left:16px}
.sheet[hidden]{display:none}
.sheet .hd{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sheet .hd > div{flex:1;min-width:0}
.sheet .body{padding:4px 16px 14px;overflow:auto;flex:1}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line)}
.sheet.min{bottom:auto}
.sheet.min .body,.sheet.min .acts{display:none}
.sheet.min .hd{border-bottom:0}
@media (max-width:760px){
  .sheet,.sheet.left{top:auto;left:8px;right:8px;bottom:0;width:auto;max-height:58vh;border-radius:0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.kind{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:2px 7px;border-radius:0;margin-bottom:6px;
  background:color-mix(in srgb,var(--career) 14%,transparent);color:var(--career)}
.kind.elec{background:#eef0f3;color:#4a525c}
.panel h2{font-family:var(--display);margin:0 0 3px;font-size:18px;line-height:1.2;font-weight:700;font-stretch:96%}
.panel .meta{margin:0;color:var(--muted);font-size:13px}
.icon{flex:none;width:32px;height:32px;display:grid;place-items:center;font:inherit;font-size:17px;line-height:1;border-radius:0;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.icon:focus-visible,.btn:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.btn{text-decoration:none;display:inline-block;font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--career);border-color:var(--career);color:#fff}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
.ficha dt{color:var(--muted)}
.ficha dd{margin:0}
.ficha .tbd{color:var(--muted);font-style:italic}
.desc{font-size:13px;margin:0;color:var(--ink)}
.sectabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:0 0 10px}
.sectab{font:inherit;font-size:12.5px;font-weight:600;padding:6px 10px;border:1px solid transparent;border-bottom:0;border-radius:0;
  background:transparent;color:var(--muted);cursor:pointer;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.sectab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.sectab:focus-visible{outline:2px solid var(--sel);outline-offset:-2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:0;background:#1f2622;color:#fff}
.tag b,.tg b{width:7px;height:7px;border-radius:50%;display:inline-block}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.box .tags{position:absolute;top:-9px;right:28px;display:flex;gap:3px}
.box .tags .tg{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;line-height:1;padding:3px 5px;border-radius:0;background:#1f2622;color:#fff;border:1px solid #fff}
.box .tags .tg b{width:6px;height:6px}
.panel h3{margin:10px 0 7px;font-size:13px;font-weight:700}
.panel h3 .dot{display:inline-block;width:9px;height:9px;border-radius:0;margin-right:6px;vertical-align:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;line-height:1.25;text-align:left;padding:5px 9px;border-radius:0;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.cond{font-size:13px;padding:8px 10px;border-radius:0;background:var(--bg);border-left:3px solid var(--career)}
.none{font-size:13px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.empty{color:var(--muted);font-size:14px}
.empty strong{color:var(--ink)}
.clear{flex:none;font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:0;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}

.foot{padding:0 24px 30px;font-size:12.5px;color:var(--muted);max-width:110ch}
.foot p{margin:4px 0}
.inst{display:flex;flex-wrap:wrap;align-items:center;gap:20px 40px;padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));
  border-top:2px solid var(--rule);background:var(--bg)}
.instlogo{height:46px;width:auto}
.seals{display:flex;align-items:center;gap:32px;margin-left:auto}
.seals img{height:40px;width:auto}
.url{font-family:var(--display);font-weight:700;color:var(--fen-blue);font-size:15px;letter-spacing:.01em}
@media (max-width:960px){.foot{padding:0 12px 24px}}

@media (prefers-reduced-motion: reduce){.box,.edge{transition:none}.box.sel{animation:none}}

/* Interruptor de vía del ciclo profesional */
.routes{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 10px;font-size:13px}
.routes[hidden]{display:none}
.routes-lbl{font-weight:700}
.routes-rule{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--career);color:#fff}
.seg button:focus-visible{outline:2px solid var(--sel);outline-offset:-3px}
</style>
</head>

  const avail=scroller.clientWidth-2;
  const k=real?1:Math.max(MIN_SCALE,Math.min(1,avail/dims.w));
  stage.style.transform=k===1?'':`scale(${k})`;
  fitEl.style.width=(dims.w*k)+'px'; fitEl.style.height=(dims.h*k)+'px';
}
new ResizeObserver(fit).observe(scroller);
zoomBtn.addEventListener('click',()=>{
  real=!real; zoomBtn.setAttribute('aria-pressed',String(real));
  zoomBtn.textContent=real?'Ajustar al ancho':'Ver a tamaño real'; fit();
});
let byId={}, kids={}, edges=[], boxEl={}, gEdges=null, list=[];

/* Pestañas */
Object.entries(CAREERS).forEach(([key,cfg])=>{
  const t=document.createElement('button'); t.className='tab'; t.type='button'; t.role='tab'; t.textContent=cfg.tab; t.dataset.key=key;
  if(cfg.pending){t.setAttribute('aria-disabled','true'); t.title='Disponible en la próxima versión';} else t.title=cfg.title+', '+cfg.sub;
  t.addEventListener('click',()=>{ if(!cfg.pending && key!==cur){cur=key; build();} });
  tabsEl.appendChild(t);
});
routesEl.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.route!==route){route=b.dataset.route; build();}
}));

function build(){
  const cfg=CAREERS[cur];
  document.getElementById('band').style.setProperty('--career',cfg.color);
  document.documentElement.style.setProperty('--career',cfg.color);
  document.getElementById('title').innerHTML=cfg.titleBr||cfg.title;
  document.getElementById('subtitle').textContent=cfg.sub;
  tabsEl.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.key===cur?'true':'false'));
  routesEl.hidden=!cfg.routes;
  if(cfg.routes){
    routesEl.querySelectorAll('[data-route]').forEach(b=>b.setAttribute('aria-checked',b.dataset.route===route?'true':'false'));
    document.getElementById('routes-rule').textContent=cfg.routes[route];
  }
  document.getElementById('foot').innerHTML=cfg.foot.map(f=>`<p>${f}</p>`).join('');

  list=cfg.courses.filter(c=>!c.rt || c.rt===route);
  byId=Object.fromEntries(list.map(c=>[c.id,c]));
  kids={}; list.forEach(c=>kids[c.id]=[]);
  edges=[];
  list.forEach(c=>(c.q||[]).forEach(p=>{ if(byId[p]){kids[p].push(c.id); edges.push({a:p,b:c.id});} }));

  const ROWS=cfg.rows;
  const stageW=PL+COLS*W+(COLS-1)*G+24, stageH=PT+ROWS*H+(ROWS-1)*RG+18;
  stage.innerHTML=''; stage.classList.remove('has-sel'); sel=null; boxEl={};
  stage.style.width=stageW+'px'; stage.style.height=stageH+'px'; dims={w:stageW,h:stageH}; fit();
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('width',stageW); svg.setAttribute('height',stageH); svg.setAttribute('aria-hidden','true');
  stage.appendChild(svg);

  [['Ciclo Básico',1,4],['Ciclo Disciplinar',5,8],['Ciclo Profesional',9,10]].forEach(([t,a,b])=>{
    const d=document.createElement('div'); d.className='cyc'; d.textContent=t;
    d.style.left=X(a)+'px'; d.style.width=(X(b)+W-X(a))+'px'; stage.appendChild(d);
  });
  for(let s=1;s<=COLS;s++){
    const d=document.createElement('div'); d.className='semh'; d.textContent='Semestre '+s;
    d.style.left=X(s)+'px'; d.style.width=W+'px'; stage.appendChild(d);
  }
  [4,8].forEach(s=>{
    const x=X(s)+W+G/2, l=document.createElementNS(NS,'line');
    l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',PT-10);l.setAttribute('y2',stageH-6);
    l.setAttribute('class','divider'); svg.appendChild(l);
  });

  gEdges=document.createElementNS(NS,'g'); svg.appendChild(gEdges);
  edges.forEach(e=>{
    const p=pathFor(byId[e.a],byId[e.b]);
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','edge');
    const path=document.createElementNS(NS,'path'); path.setAttribute('d',p.d);
    const dot=document.createElementNS(NS,'circle'); dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y); dot.setAttribute('r',2.6);
    g.appendChild(path); g.appendChild(dot); gEdges.appendChild(g); e.el=g;
  });

  list.forEach(c=>{
    const b=document.createElement('button'); b.type='button'; b.className='box';
    b.style.cssText=`left:${X(c.s)}px;top:${Y(c.r)}px;width:${WD(c)}px;height:${H}px;--f:${FILL[c.k]};color:${INK[c.k]||'#1d2330'}`;
    b.setAttribute('aria-label',`${c.n}, ${c.c} créditos SCT`);
    b.innerHTML=`<span class="nm">${c.b||c.n}</span><span class="cr">${c.c}</span>`+
      (c.cr?`<span class="badge">${c.cr} SCT</span>`:'')+(secTags(c).length?`<span class="tags">${secTags(c).slice(0,3).map(t=>tagHTML(t,'tg')).join('')}${secTags(c).length>3?`<span class="tg">+${secTags(c).length-3}</span>`:''}</span>`:'')+(c.n3?`<span class="n3">(3)</span>`:'');
    b.addEventListener('click',ev=>{ev.stopPropagation(); select(sel===c.id?null:c.id);});
    b.addEventListener('mouseenter',()=>hover(c.id,true));
    b.addEventListener('mouseleave',()=>hover(c.id,false));
    stage.appendChild(b); boxEl[c.id]=b;
  });
  renderEmpty();
}

function pathFor(a,b){
  const ay=Y(a.r)+H/2, by=Y(b.r)+H/2, ax=X(a.s)+WD(a), bx=X(b.s);
  if(bx-ax>8){const d=Math.max(26,(bx-ax)*.5);return {d:`M${ax},${ay} C${ax+d},${ay} ${bx-d},${by} ${bx},${by}`,x:bx,y:by};}
  const sx=X(a.s), lx=Math.min(sx,bx)-32;
  return {d:`M${sx},${ay} C${lx},${ay} ${lx},${by} ${bx},${by}`,x:bx,y:by};
}
function hover(id,on){
  if(sel) return;
  edges.forEach(e=>{if(e.a===id||e.b===id) e.el.classList.toggle('hov',on);});
}
function walk(start,next){
  const depth={}, queue=[[start,0]];
  while(queue.length){
    const [id,d]=queue.shift();
    next(id).forEach(n=>{ if(!(n in depth)){depth[n]=d+1; queue.push([n,d+1]);} });
  }
  return depth;
}
const lvl=d=>'d'+Math.min(d,3);

function select(id){
  sel=id;
  list.forEach(c=>boxEl[c.id].className='box');
  edges.forEach(e=>e.el.setAttribute('class','edge'));
  stage.classList.toggle('has-sel',!!id);
  if(!id){renderEmpty();return;}
  const anc=walk(id,x=>(byId[x].q||[]).filter(p=>byId[p])), des=walk(id,x=>kids[x]);
  boxEl[id].classList.add('sel');
  Object.entries(anc).forEach(([k,d])=>boxEl[k].classList.add('pre',lvl(d)));
  Object.entries(des).forEach(([k,d])=>boxEl[k].classList.add('post',lvl(d)));
  const top=[];
  edges.forEach(e=>{
    if(e.a in anc && (e.b===id || e.b in anc)){e.el.setAttribute('class','edge pre '+lvl(anc[e.a])); top.push(e.el);}
    else if(e.b in des && (e.a===id || e.a in des)){e.el.setAttribute('class','edge post '+lvl(des[e.b])); top.push(e.el);}
  });
  top.forEach(el=>gEdges.appendChild(el));
  renderPanel(byId[id],anc,des);
}

const ciclo=s=>s<=4?'Ciclo Básico':s<=8?'Ciclo Disciplinar':'Ciclo Profesional';
const chip=id=>`<button type="button" class="chip" data-go="${id}">${byId[id].n}</button>`;
const RT_NAME={mag:'Vía Electivos Magíster',pra:'Vía Práctica Profesional'};

/* Catálogo de etiquetas: se agregan nuevas aquí */
const TAGS={AVM:{c:'#f59e0b',t:'Metodología AVM'},EN:{c:'#2563eb',t:'Dictación en inglés'},MINOR:{c:'#9333ea',t:'Parte de un minor'},
  EMP:{c:'#ea580c',t:'Emprendimiento'},IA:{c:'#0891b2',t:'Trabaja temas de IA'},SUS:{c:'#16a34a',t:'Sustentabilidad'}};
const tagHTML=(t,cls='tag')=>`<span class="${cls}" title="${(TAGS[t]||{}).t||t}"><b style="background:${(TAGS[t]||{}).c||'#888'}"></b>${t}</span>`;
const secTags=c=>{const d=c.d||{};return [...new Set([...(d.tags||[]),...((d.sections||[]).flatMap(x=>x.tags||[]))])];};
const secLabel=n=>n.length===1?'Sección '+n[0]:'Secciones '+n.slice(0,-1).join(', ')+' y '+n[n.length-1];
let secIdx=0, panelFor=null;
const ELEC_KEYS=new Set(['ele','em','epr','ees','lib']);
const isElec=c=>ELEC_KEYS.has(c.k)||/^(Electivo|Libre)/.test(c.n);
function elecHow(c){
  if(c.k==='lib'||/^Libre/.test(c.n)) return 'Se completa con un curso de libre elección. '+LIB;
  if(/Entorno Social/.test(c.n)) return 'Se completa con un curso del área de entorno social y científico.';
  if(/Profundización/.test(c.n)) return 'Se completa con un curso electivo de profundización de pregrado.';
  if(/Negocios para la Economía/.test(c.n)) return 'Se completa con un curso electivo del área de negocios.';
  if(c.rt==='mag') return 'Se completa con un curso de un programa de magíster de la FEN. Permite avanzar en la articulación con un magíster y cursar asignaturas de minors.';
  return 'Se completa con un electivo profesional de pregrado o con un curso de magíster. Permite avanzar en la articulación con un magíster y cursar asignaturas de minors.';
}
const tbd='<span class="tbd">Por completar</span>';
const val=(v)=>v&&(!Array.isArray(v)||v.length)?(Array.isArray(v)?v.join(', '):v):tbd;
let minimized=false;

function renderEmpty(){ panel.hidden=true; panel.innerHTML=''; }

function reqHTML(c){
  const q=(c.q||[]).filter(p=>byId[p]);
  if(q.length) return `<div class="chips">${q.map(chip).join('')}</div>`+(c.cr?`<p class="cond" style="margin-top:8px">Además, mínimo ${c.cr} créditos SCT aprobados.</p>`:'');
  if(c.cr) return `<p class="cond">Al menos ${c.cr} créditos SCT aprobados.</p>`;
  return `<p class="none">Sin requisitos previos (ingreso por admisión).</p>`;
}

function renderPanel(c,anc,des){
  const cfg=CAREERS[cur], elec=isElec(c);
  const sem=c.span?'Semestre 1 o 2':'Semestre '+c.s;
  const k=kids[c.id];
  const nA=Object.keys(anc).length, nD=Object.keys(des).length;
  const rtNote=c.rt&&cfg.routes?`<p class="note">${RT_NAME[c.rt]}: ${cfg.routes[c.rt]}</p>`:'';
  const head=`<div class="hd"><div>
      <span class="kind${elec?' elec':''}">${elec?'Cupo electivo':'Curso obligatorio'}</span>
      <h2 id="ph">${c.n}</h2><p class="meta">${sem}, ${ciclo(c.s).toLowerCase()}. ${c.c} créditos SCT.</p>${secTags(c).length?`<div class="tagrow">${secTags(c).map(t=>tagHTML(t)).join('')}</div>`:''}</div>
      <button type="button" class="icon" data-min aria-label="${minimized?'Expandir':'Minimizar'} panel" aria-expanded="${!minimized}">${minimized?'+':'&minus;'}</button>
      <button type="button" class="icon" data-clear aria-label="Cerrar panel">&times;</button></div>`;
  let body, acts;
  if(elec){
    body=`<h3>Requisito para inscribir</h3>${reqHTML(c)}
      <h3>Cómo se completa</h3><p class="none" style="color:var(--ink)">${elecHow(c)}</p>
      <h3>Oferta disponible</h3><p class="none">${tbd}</p>
      ${k.length?`<h3><span class="dot" style="background:var(--post)"></span>Habilita directamente</h3><div class="chips">${k.map(chip).join('')}</div>`:''}
      ${rtNote}`;
    acts=`<button type="button" class="btn primary" aria-disabled="true" title="Oferta aún no disponible">Ver oferta de electivos</button>`;
  } else {
    const d=c.d||{};
    if(panelFor!==c.id){secIdx=0; panelFor=c.id;}
    const secs=d.sections||[];
    const sec=secs[secIdx]||{};
    const pick=f=>secs.length&&sec[f]!==undefined?sec[f]:d[f];
    const tabs=secs.length?`
      <div class="sectabs" role="tablist" aria-label="Secciones del curso">
        ${secs.map((x,i)=>`<button type="button" class="sectab" role="tab" id="st${i}" aria-controls="sp" aria-selected="${i===secIdx}" tabindex="${i===secIdx?0:-1}" data-sec="${i}">${secLabel(x.n)}${(x.tags||[]).map(t=>tagHTML(t)).join('')}</button>`).join('')}
      </div>`:'';
    body=`<h3><span class="dot" style="background:var(--pre)"></span>Requisitos directos</h3>${reqHTML(c)}
      <h3><span class="dot" style="background:var(--post)"></span>Habilita directamente</h3>
      ${k.length?`<div class="chips">${k.map(chip).join('')}</div>`:'<p class="none">No es requisito de otro curso de la malla.</p>'}
      <p class="none" style="color:var(--ink);margin-top:10px">Cadena completa: ${nA} ${nA===1?'curso previo':'cursos previos'} y ${nD} ${nD===1?'curso que depende':'cursos que dependen'} de este.</p>
      <h3>Descripción</h3><p class="desc">${val(d.desc)}</p>
      <h3>Información del curso</h3>${tabs}
      <dl class="ficha"${secs.length?` role="tabpanel" id="sp" aria-labelledby="st${secIdx}"`:''}>
        <dt>Código</dt><dd>${val(d.code)}</dd>
        <dt>Idioma</dt><dd>${val(pick('lang'))}</dd>
        <dt>Metodología</dt><dd>${val(pick('met'))}</dd>
        ${secs.length?`<dt>Docente</dt><dd>${val(sec.prof)}</dd>`:''}
        <dt>Competencias genéricas</dt><dd>${val(d.compG)}</dd>
        <dt>Competencias específicas</dt><dd>${val(d.compE)}</dd>
        <dt>ODS</dt><dd>${val(d.ods)}</dd>
        <dt>Minor</dt><dd>${val(d.minor)}</dd>
        ${cur==='icla'?`<dt>Especialización</dt><dd>${val(d.esp)}</dd>`:''}
      </dl>
      ${c.note?`<p class="note">${c.note}</p>`:''}${rtNote}`;
    const secSyl=secs.filter(x=>x.syllabus);
    acts=(d.syllabus?`<a class="btn primary" href="${d.syllabus}" target="_blank" rel="noopener">Syllabus</a>`:`<button type="button" class="btn primary" aria-disabled="true" title="Syllabus aún no disponible">Syllabus</button>`)+
      secSyl.map(x=>`<a class="btn" href="${x.syllabus}" target="_blank" rel="noopener">Syllabus ${secLabel(x.n).toLowerCase()}</a>`).join('');
  }
  panel.innerHTML=head+`<div class="body">${body}</div><div class="acts">${acts}</div>`;
  panel.setAttribute('aria-labelledby','ph');
  panel.classList.toggle('min',minimized);
  /* El panel se ubica en el costado con menos cursos de la cadena */
  const cols=[c.s,...Object.keys(anc).map(x=>byId[x].s),...Object.keys(des).map(x=>byId[x].s)];
  const leftN=cols.filter(x=>x<=3).length, rightN=cols.filter(x=>x>=8).length;
  panel.classList.toggle('left',leftN<rightN);
  panel.hidden=false;
}

function renderSel(){
  const anc=walk(sel,x=>(byId[x].q||[]).filter(p=>byId[p])), des=walk(sel,x=>kids[x]);
  const st=panel.querySelector('.body')?panel.querySelector('.body').scrollTop:0;
  renderPanel(byId[sel],anc,des); const b=panel.querySelector('.body'); if(b) b.scrollTop=st;
}
panel.addEventListener('keydown',e=>{
  const st=e.target.closest('[data-sec]'); if(!st) return;
  const n=panel.querySelectorAll('[data-sec]').length;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault(); secIdx=(secIdx+(e.key==='ArrowRight'?1:n-1))%n; renderSel();
    panel.querySelector(`[data-sec="${secIdx}"]`).focus();
  }
});
panel.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){
    const id=go.dataset.go; select(id);
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    boxEl[id].scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest',inline:'center'});
    boxEl[id].focus({preventScroll:true});
  }
  if(e.target.closest('[data-clear]')) select(null);
  if(e.target.closest('[data-min]')){ minimized=!minimized; select(sel); }
  const st=e.target.closest('[data-sec]');
  if(st){ secIdx=+st.dataset.sec; renderSel(); panel.querySelector(`[data-sec="${secIdx}"]`).focus(); }
});
stage.addEventListener('click',()=>select(null));
document.addEventListener('keydown',e=>{if(e.key==='Escape') select(null);});
build();
})();
</script>
</body>
</html>
